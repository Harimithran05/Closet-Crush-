
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products | Closet Crush</title>
<link rel="stylesheet" href="web.css">

<style>
.products-heading {
    text-align: center;
    padding: 45px 15px;
    background: #f8dfe4;
}
.products-heading h1 {
    color: #864c55;
    font-size: 40px;
    font-weight: normal;
}
.products-heading p { margin-top: 10px; color: #90656b; }

.product-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 25px;
    max-width: 1150px;
    margin: 35px auto;
    padding: 0 20px;
}
.product-card {
    background: white;
    border: 1px solid #f0d0d6;
    border-radius: 8px;
    padding: 15px;
    text-align: center;
}
.product-image {
    height: 220px;
    background: #f9e9ed;
    border-radius: 5px;
    overflow: hidden;
}
.product-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.product-card h3 { color: #864c55; margin-top: 15px; }
.product-card p { margin: 7px 0; color: #80666a; }
.price { font-weight: bold; color: #a65c6c !important; }

.shop-button, .action-button {
    display: inline-block;
    border: none;
    border-radius: 4px;
    padding: 12px 20px;
    background: #b96879;
    color: white;
    text-decoration: none;
    cursor: pointer;
    margin-top: 10px;
}
.shop-button:hover, .action-button:hover { background: #914b5b; }

.cart-section {
    max-width: 900px;
    margin: 40px auto;
    padding: 25px;
    background: #fff0f2;
    border-radius: 8px;
}
.cart-section h2 { color: #864c55; margin-bottom: 15px; }
.cart-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid #e8cbd1;
}
.cart-row button {
    border: none;
    background: none;
    color: #a33e56;
    cursor: pointer;
}
.cart-total { text-align: right; margin-top: 20px; font-weight: bold; }

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(40, 20, 25, 0.6);
    z-index: 10;
    justify-content: center;
    align-items: center;
    padding: 15px;
}
.modal-content {
    width: 100%;
    max-width: 430px;
    max-height: 90vh;
    overflow-y: auto;
    background: #fffafb;
    padding: 28px;
    border-radius: 8px;
}
.modal-content h2 { color: #864c55; margin-bottom: 15px; }
.modal-content label { display: block; margin-top: 15px; }
.modal-content select, .modal-content input {
    width: 100%;
    padding: 11px;
    margin-top: 6px;
    border: 1px solid #e6c6cd;
    background: white;
}
.close-button {
    float: right;
    border: none;
    background: none;
    font-size: 25px;
    cursor: pointer;
}
.cart-empty { color: #80666a; }

@media(max-width: 750px) {
    .product-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media(max-width: 480px) {
    .product-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header class="site-header">
    <a href="index.html" class="brand">CLOSET CRUSH</a>
    <p class="tagline">WEAR YOUR CONFIDENCE</p>
    <div class="brand-line"></div>
    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="collections.html">Collections</a>
        <a href="products.html" class="active">Products</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="products-heading">
    <h1>Our Products</h1>
    <p>Find your favourite style at Closet Crush.</p>
</section>

<main>
    <section class="product-grid" id="productGrid"></section>

    <section class="cart-section" id="cart">
        <h2>My Shopping Cart</h2>
        <div id="cartItems">
            <p class="cart-empty">Your cart is empty.</p>
        </div>
        <div class="cart-total" id="cartTotal">Total: ₹0</div>
        <button class="action-button" onclick="goToPayment()">
            NEXT — PAYMENT
        </button>
    </section>
</main>
<div class="modal" id="productModal">
    <div class="modal-content">
        <button class="close-button" onclick="closeModal()" aria-label="Close">&times;</button>
        <h2 id="modalName">Product</h2>
        <p id="modalBrand"></p>
        <p id="modalPrice" class="price"></p>

        <label for="size">Choose Size</label>
        <select id="size">
            <option value="S">Small (S)</option>
            <option value="M" selected>Medium (M)</option>
            <option value="L">Large (L)</option>
            <option value="XL">Extra Large (XL)</option>
            <option value="Free Size">Free Size</option>
        </select>

        <label for="color">Choose Colour</label>
        <select id="color">
            <option>Pink</option>
            <option>Black</option>
            <option>White</option>
            <option>Blue</option>
            <option>Red</option>
            <option>Beige</option>
            <option>Gold</option>
        </select>

        <label for="quantity">Quantity</label>
        <input id="quantity" type="number" min="1" max="10" value="1">

        <button class="action-button" onclick="addToCart()">ADD TO CART</button>
    </div>
</div>

<script>
const products = [
    {
        id: 1,
        name: "Formal Dress",
        brand: "Elegance Studio",
        price: 1499,
        image: "https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&w=600&q=80"
    },
    {
        id: 2,
        name: "Handbag",
        brand: "Chic Avenue",
        price: 999,
        image: "https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=600&q=80"
    },
    {
        id: 3,
        name: "Heels",
        brand: "Luxe Steps",
        price: 1299,
        image: "https://images.unsplash.com/photo-1543163521-1bf539c55dd2?auto=format&fit=crop&w=600&q=80"
    },
    {
        id: 4,
        name: "Western Top",
        brand: "Urban Bloom",
        price: 799,
        image: "https://images.unsplash.com/photo-1551163943-3f6a855d1153?auto=format&fit=crop&w=600&q=80"
    },
    {
        id: 5,
        name: "Saree",
        brand: "Traditional Grace",
        price: 2499,
        image: "https://images.unsplash.com/photo-1610030469983-98e550d6193c?auto=format&fit=crop&w=600&q=80"
    }
];

let selectedProduct = null;
let cart = JSON.parse(localStorage.getItem("closetCrushCart") || "[]");

function renderProducts() {
    document.getElementById("productGrid").innerHTML = products.map(p => `
        <article class="product-card">
            <div class="product-image">
                <img src="${p.image}" alt="${p.name}"
                     onerror="this.style.display='none'">
            </div>
            <h3>${p.name}</h3>
            <p>Brand: ${p.brand}</p>
            <p class="price">₹${p.price.toLocaleString("en-IN")}</p>
            <button class="shop-button" onclick="openProduct(${p.id})">
                VIEW / ORDER
            </button>
        </article>
    `).join("");
}

function openProduct(id) {
    selectedProduct = products.find(p => p.id === id);
    document.getElementById("modalName").textContent = selectedProduct.name;
    document.getElementById("modalBrand").textContent =
        "Brand: " + selectedProduct.brand;
    document.getElementById("modalPrice").textContent =
        "Price: ₹" + selectedProduct.price.toLocaleString("en-IN");

    document.getElementById("size").value =
        selectedProduct.id === 2 || selectedProduct.id === 3
        ? "Free Size" : "M";
    document.getElementById("productModal").style.display = "flex";
}

function closeModal() {
    document.getElementById("productModal").style.display = "none";
}

function addToCart() {
    if (!selectedProduct) return;

    const quantity = Number(document.getElementById("quantity").value);
    if (!Number.isInteger(quantity) || quantity < 1 || quantity > 10) {
        alert("Please choose a quantity from 1 to 10.");
        return;
    }

    cart.push({
        ...selectedProduct,
        size: document.getElementById("size").value,
        color: document.getElementById("color").value,
        quantity: quantity
    });

    saveCart();
    closeModal();
    document.getElementById("cart").scrollIntoView({ behavior: "smooth" });
}

function saveCart() {
    localStorage.setItem("closetCrushCart", JSON.stringify(cart));
    renderCart();
}

function renderCart() {
    const container = document.getElementById("cartItems");

    if (cart.length === 0) {
        container.innerHTML = '<p class="cart-empty">Your cart is empty.</p>';
    } else {
        container.innerHTML = cart.map((item, index) => `
            <div class="cart-row">
                <div>
                    <strong>${item.name}</strong><br>
                    Brand: ${item.brand}<br>
                    Size: ${item.size} | Colour: ${item.color}<br>
                    Quantity: ${item.quantity}<br>
                    ₹${(item.price * item.quantity).toLocaleString("en-IN")}
                </div>
                <button onclick="removeItem(${index})">Remove</button>
            </div>
        `).join("");
    }

    const total = cart.reduce((sum, item) =>
        sum + item.price * item.quantity, 0);

    document.getElementById("cartTotal").textContent =
        "Total: ₹" + total.toLocaleString("en-IN");
}

function removeItem(index) {
    cart.splice(index, 1);
    saveCart();
}

function goToPayment() {
    if (cart.length === 0) {
        alert("Please add a product to your cart first.");
        return;
    }
    window.location.href = "payment.html";
}

renderProducts();
renderCart();
</script>

</body>
</html>
